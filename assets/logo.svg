<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img">
  <title>Mot du Jour CI</title>
  <defs>
    <linearGradient id="fondGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1208"/>
      <stop offset="100%" stop-color="#0A0806"/>
    </linearGradient>
    <radialGradient id="haloOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F77F00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F77F00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="300" rx="24" fill="url(#fondGrad)"/>

  <!-- Bandes drapeau CI gauche -->
  <rect x="0" y="0"   width="10" height="100" fill="#F77F00"/>
  <rect x="0" y="100" width="10" height="100" fill="#FDF8F0"/>
  <rect x="0" y="200" width="10" height="100" fill="#009E60"/>

  <!-- Bandes drapeau CI droite -->
  <rect x="790" y="0"   width="10" height="100" fill="#F77F00"/>
  <rect x="790" y="100" width="10" height="100" fill="#FDF8F0"/>
  <rect x="790" y="200" width="10" height="100" fill="#009E60"/>

  <!-- Lignes déco -->
  <rect x="30" y="18"  width="740" height="2" rx="1" fill="rgba(247,127,0,0.25)"/>
  <rect x="30" y="280" width="740" height="2" rx="1" fill="rgba(0,158,96,0.25)"/>

  <!-- Halo + grande lettre M -->
  <ellipse cx="148" cy="150" rx="110" ry="110" fill="url(#haloOrange)"/>
  <text x="148" y="218"
        text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="200" font-weight="900"
        fill="#F77F00" filter="url(#glow)" opacity="0.95">M</text>

  <!-- Séparateur vertical -->
  <rect x="270" y="40" width="3" height="220" rx="2" fill="rgba(247,127,0,0.3)"/>

  <!-- Texte principal -->
  <text x="316" y="120"
        font-family="Arial Black, Impact, sans-serif"
        font-size="58" font-weight="900"
        fill="#FDF8F0" letter-spacing="4">MOT DU JOUR</text>

  <rect x="316" y="134" width="450" height="3" rx="2" fill="rgba(247,127,0,0.5)"/>

  <text x="316" y="185"
        font-family="Arial, sans-serif"
        font-size="34" font-weight="700"
        fill="#F77F00" letter-spacing="6">CÔTE D'IVOIRE</text>

  <text x="660" y="185" font-size="34">🇨🇮</text>

  <rect x="316" y="200" width="450" height="1" rx="1" fill="rgba(253,248,240,0.1)"/>

  <text x="316" y="240"
        font-family="Arial, sans-serif"
        font-size="18" font-weight="600"
        fill="#009E60" letter-spacing="3"
        filter="url(#glowGreen)">1 JOUR  ·  1 MOT  ·  CHAQUE JOUR</text>

  <!-- Points déco coins -->
  <circle cx="44"  cy="44"  r="4" fill="rgba(247,127,0,0.4)"/>
  <circle cx="756" cy="44"  r="4" fill="rgba(247,127,0,0.4)"/>
  <circle cx="44"  cy="256" r="4" fill="rgba(0,158,96,0.4)"/>
  <circle cx="756" cy="256" r="4" fill="rgba(0,158,96,0.4)"/>
</svg>
