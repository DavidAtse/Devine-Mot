<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#221A0E"/>
      <stop offset="100%" stop-color="#0F0C07"/>
    </linearGradient>
    <clipPath id="round"><rect width="192" height="192" rx="36"/></clipPath>
  </defs>

  <!-- Fond arrondi -->
  <rect width="192" height="192" rx="36" fill="url(#bg)"/>

  <!-- Bande drapeau CI en haut -->
  <rect x="0"   y="0" width="64"  height="10" rx="0" fill="#F77F00"/>
  <rect x="64"  y="0" width="64"  height="10" fill="#FDF8F0"/>
  <rect x="128" y="0" width="64"  height="10" fill="#009E60"/>

  <!-- Lettre M -->
  <text x="96" y="92"
        text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="72"
        font-weight="900"
        fill="#F77F00"
        letter-spacing="-2">M</text>

  <!-- Sous-titre DJ -->
  <text x="96" y="134"
        text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="38"
        font-weight="900"
        fill="#FDF8F0"
        letter-spacing="4">DJ</text>

  <!-- Thermomètre emoji zone -->
  <text x="96" y="174"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="22"
        fill="#009E60">🇨🇮 CI</text>
</svg>
