<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#221A0E"/>
      <stop offset="100%" stop-color="#0F0C07"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Bande drapeau CI en haut -->
  <rect x="0"   y="0" width="171" height="22" fill="#F77F00"/>
  <rect x="171" y="0" width="170" height="22" fill="#FDF8F0"/>
  <rect x="341" y="0" width="171" height="22" fill="#009E60"/>

  <!-- Cercle décoratif derrière le M -->
  <circle cx="256" cy="210" r="140" fill="rgba(247,127,0,0.07)"/>
  <circle cx="256" cy="210" r="140" fill="none" stroke="rgba(247,127,0,0.15)" stroke-width="2"/>

  <!-- Grande lettre M -->
  <text x="256" y="270"
        text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="200"
        font-weight="900"
        fill="#F77F00">M</text>

  <!-- DJ en dessous -->
  <text x="256" y="360"
        text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="100"
        font-weight="900"
        letter-spacing="12"
        fill="#FDF8F0">DJ</text>

  <!-- Ligne séparatrice -->
  <rect x="80" y="380" width="352" height="3" rx="2" fill="rgba(247,127,0,0.3)"/>

  <!-- Sous-texte -->
  <text x="256" y="438"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="42"
        font-weight="700"
        letter-spacing="6"
        fill="#009E60">MOT DU JOUR</text>

  <!-- CI -->
  <text x="256" y="490"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="28"
        font-weight="600"
        fill="rgba(253,248,240,0.4)"
        letter-spacing="4">CÔTE D'IVOIRE</text>
</svg>
