# nixpacks.toml — Configuration Nixpacks pour Railway
# Déploiement PHP avec les extensions nécessaires au jeu DevineMot CI

[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.mysqli",
    "php83Extensions.curl",
    "php83Extensions.mbstring",
    "php83Extensions.openssl",
    "php83Extensions.session",
    "php83Extensions.json",
    "php83Extensions.fileinfo"
]

[start]
cmd = "php -S 0.0.0.0:$PORT"
